services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farmtrack
      POSTGRES_USER: farmtrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - farmtrack-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmtrack -d farmtrack"]
      interval: 5s
      timeout: 3s
      retries: 20
  field-service:
    build:
      context: .
      dockerfile: services/fields/Dockerfile
    ports: ["127.0.0.1:8080:8000"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      ACTIVITY_SERVICE_URL: http://activity-service:8000
    depends_on:
      postgres:
        condition: service_healthy
  activity-service:
    build:
      context: .
      dockerfile: services/activities/Dockerfile
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      FIELD_SERVICE_URL: http://field-service:8000
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  farmtrack-data:

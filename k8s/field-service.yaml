apiVersion: apps/v1
kind: Deployment
metadata:
  name: field-service
  namespace: farmtrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: field-service
  template:
    metadata:
      labels:
        app: field-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: pradyummm/farmtrack-fields:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: password
            - name: ACTIVITY_SERVICE_URL
              value: http://activity-service:8000
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: field-service
  namespace: farmtrack
spec:
  selector:
    app: field-service
  ports:
    - port: 8000
      targetPort: 8000
